[project]
name = "vidoctor"
version = "0.1.0"
description = "AI 영상 감수 에이전트 — 5차원 분석 (filler / CPS / dead zone / gaze / content gap)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# fly main(FastAPI gateway)이 실제 import하는 패키지만 base. 분석 전용 ML deps는
# [project.optional-dependencies] analyze로 분리해 fly 이미지 크기 ~2GB 절감.
dependencies = [
    # HTTP
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "slowapi>=0.1.9",
    # 도메인 모델·설정
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.0.0",
    # 외부 서비스 클라이언트
    "supabase>=2.10.0",
    "boto3>=1.35.0",
    "yt-dlp>=2025.1.15",
    "modal>=1.4.3",
    # LLM·관측 — fly의 category_classifier가 GPT-4o 호출
    "openai>=1.50.0",
    "langchain-openai>=0.2.0",
    # langfuse.langchain 서브모듈이 langchain 메인 패키지를 require하고, vidoctor.llm이
    # module-level에서 CallbackHandler import — 누락 시 fly main startup이 ImportError로 실패.
    "langchain>=0.3.0",
    "langfuse>=2.50.0",
    # vidoctor.graph __init__ chain이 langgraph import. fly는 graph 실행 안 하지만
    # `from vidoctor.graph import Category` 등 import 자체는 발생.
    "langgraph>=0.2.50",
    # 카테고리 분류용 cv2 keyframe seek
    "opencv-python>=4.13.0.92",
]

[project.optional-dependencies]
# Modal 컨테이너에서만 install. ASR/비전/오디오 분석 전용 ML deps.
analyze = [
    "whisperx>=3.8.5",
    "torch>=2.0.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.0.0",
    "mediapipe>=0.10.18",
    "scenedetect>=0.6.7.1",
    "librosa>=0.11.0",
    "silero-vad>=6.2.1",
    # 3.x 보안 미들웨어가 localhost-only인데도 403 반환해 회피
    "mlflow>=2.18.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pyright>=1.1.380",
    "pytest-asyncio>=1.3.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidoctor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성·파라미터 marker는 함수 호출 형태지만 *내부 상태 없는 마커 객체* 반환 —
# B008(함수 호출을 인자 기본값으로 두지 마라)이 false positive로 잡아 제외.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # pyannote.audio가 torchcodec 로드 실패 시 경고 — fallback 동작하므로 무시
    "ignore::UserWarning:pyannote.audio.core.io",
]

# 배포 이미지(Linux)는 Modal GPU에서 WhisperX/ctranslate2 추론을 돌리므로 CUDA wheel을
# 받는다 — nvidia-cudnn-cu12(9.x)·cublas를 번들해 ctranslate2 4.7의 GPU 요구(CUDA 12.3+,
# cuDNN 9)를 충족. macOS(로컬 dev)는 PyPI default(MPS 가속 CPU wheel)라 마커로 분기.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
# torchvision/torchaudio는 transformers·pyannote.audio transitive로 들어오는데, torch
# CUDA wheel과 ABI 호환을 맞추려면 같은 CUDA index에서 가져와야 한다(operator·so 불일치 방지).
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
