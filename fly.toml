# fly.toml app configuration file generated for vidoctor on 2026-05-18T11:09:43+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vidoctor'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # suspend 시 다시 깨어날 때 6분 warm-up이 503 유발 → 'off'로 영구 가동.
  # 채용 데모 안정성 우선, 트래픽 폭주 시 동시 분석 한도(2)로 자연 backpressure.
  auto_stop_machines = 'off'
  # 한 대만 운영. 두 대 동시 startup 시 health check 충돌로 503 발생하던 문제 회피.
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 20
    soft_limit = 10

  [[http_service.checks]]
    interval = '30s'
    timeout = '2s'
    # 컨테이너 시작 시 WhisperX 모델(1.5GB) 사전 로드에 1~2분 소요되어 grace_period 확장.
    grace_period = '3m0s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'performance-2x'
