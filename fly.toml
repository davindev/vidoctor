# fly.toml app configuration file generated for vidoctor on 2026-05-18T11:09:43+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vidoctor'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # cold start 제거 — 채용 데모 시 첫 방문도 즉시 응답하도록 1대 항상 가동.
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 20
    soft_limit = 10

  [[http_service.checks]]
    interval = '30s'
    timeout = '2s'
    # 컨테이너 시작 시 WhisperX 모델(1.5GB) 사전 로드에 1~2분 소요되어 grace_period 확장.
    grace_period = '3m0s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'performance-2x'
