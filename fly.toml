# fly.toml app configuration file generated for vidoctor on 2026-05-18T11:09:43+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vidoctor'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # 데모 안정성: suspend resume 6분이 503 유발해 'off'로 영구 가동.
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '2s'
    grace_period = '30s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  # main은 HTTP gateway·R2 업로드·DB I/O만 — 분석은 Modal로 위임. 4GB로 충분.
  size = 'performance-2x'
